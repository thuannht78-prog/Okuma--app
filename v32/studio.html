.igf-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.igf-row label{font-size:11px;color:#9AA3AE;min-width:108px}
.igf-row input{background:#0E1114;border:1px solid #3A3E47;color:#E6F4F8;border-radius:3px;padding:5px 7px;width:88px;font:inherit;font-size:12px}
.igf-row input:focus{outline:2px solid #45D8E8;outline-offset:0;border-color:#45D8E8}
.igf-row input[type=text]{width:120px}
.igf-table{width:100%;border-collapse:collapse;font-size:11.5px}
.igf-table th{color:#7E8B98;font-weight:500;text-align:left;padding:3px 6px;border-bottom:1px solid #33373F;font-size:10px;letter-spacing:.08em}
.igf-table td{padding:4px 6px;border-bottom:1px solid #23262C;cursor:pointer}
.igf-table tr.sel td{background:#3A102E;color:#FFB3EC}
.igf-table tr:hover td{background:#23262C}
.igf-menu{display:flex;gap:5px;flex-wrap:wrap;padding:6px 4px;background:#14171B;border-radius:3px}
.igf-btn{background:#2B2F36;border:1px solid #454B55;color:#D9DCE3;border-radius:3px;padding:6px 10px;font:inherit;font-size:11px;cursor:pointer;letter-spacing:.04em}
.igf-btn.sm{padding:4px 8px;font-size:10px}
.igf-btn:hover{background:#363B44;border-color:#5A6270}
.igf-btn:disabled{opacity:.35;cursor:default}
.igf-btn.acc{background:#114A52;border-color:#1F7C88;color:#9FF0F8}
.igf-btn.acc:hover{background:#15616B}
.igf-btn.on{background:#274D1F;border-color:#4E9140;color:#A8F09A}
.igf-btn.warn{background:#4A1140;border-color:#88307C;color:#F2A8E8}
.igf-btn.del{background:#3A1220;border-color:#8A2F4A;color:#F2A8C0}
.igf-btn:focus-visible{outline:2px solid #45D8E8;outline-offset:1px}
.igf-ov{background:#23262Cdd;border:1px solid #454B55;color:#D9DCE3;border-radius:3px;min-width:30px;height:30px;font:inherit;font-size:13px;cursor:pointer;padding:0 7px}
.igf-ov:hover{background:#363B44}
.igf-ov:disabled{opacity:.35;cursor:default}
.igf-fkeys{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#1C1F24;border-top:1px solid #33373F;padding:6px 8px}
.igf-fk{background:#2B2F36;border:1px solid #454B55;border-top:2px solid #E8C43A;border-radius:3px;color:#D9DCE3;padding:4px 1px;font:inherit;font-size:9.5px;cursor:pointer;text-align:center;line-height:1.25;min-height:38px}
.igf-fk:hover{background:#3A4049}
.igf-fk small{display:block;color:#7E8B98;font-size:8px}
.igf-tabs{display:flex;gap:6px;padding:8px 10px 0;align-items:center;flex-wrap:wrap}
.igf-tab{background:none;border:1px solid #33373F;border-bottom:none;border-radius:4px 4px 0 0;color:#9AA3AE;padding:6px 14px;font:inherit;font-size:11px;cursor:pointer;letter-spacing:.08em}
.igf-tab.on{background:#0A0D10;color:#45D8E8;border-color:#33373F}
.igf-view{flex:1;min-height:340px;border-top:1px solid #33373F;position:relative;padding-right:26px;background:#15171B}
.igf-view::after{content:"\u2261";position:absolute;right:5px;top:50%;transform:translateY(-50%);color:#3A434C;font-size:13px;pointer-events:none}
.igf-warn{font-size:11px;color:#F2C28B;line-height:1.5}
.igf-note{font-size:10.5px;color:#7E8B98;line-height:1.55;margin-top:6px}
.igf-snap{width:56px!important}
@media (max-width:760px){.igf-fkeys{grid-template-columns:repeat(4,1fr)}.igf-left{max-width:none}.igf-view{min-height:300px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
